name: BabyBudget — Design review

on:
  push:
    branches:
      - design/refonte-premium-2026
      - feat/babybudget-unified-upgrade-2026
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  database-migration:
    name: PostgreSQL 17 — migration, RLS, deletion cascade
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: babybudget-fixture-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: babybudget-fixture-only
    steps:
      - name: Checkout audited code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Test migration on ephemeral PostgreSQL only
        run: bash scripts/pg/verify.sh

  validate:
    name: Lint, TypeScript & build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: this-is-a-test-only-placeholder
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout the reviewed code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install browser smoke test runner (no lockfile modification)
        run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
      - name: Recurrence, CSV and worker regression
        run: node --test scripts/recurrence-regression.cjs scripts/edge-recurring-regression.cjs
      - name: TypeScript
        run: npx tsc --noEmit
      - name: ESLint
        run: npm run lint
      - name: Production build (dummy Supabase environment)
        run: npm run build
      - name: Install browser for functional smoke tests
        run: npx playwright install chromium --only-shell
      - name: Smoke test — routes publiques
        run: |
          set -euo pipefail
          npm run start -- -p 3123 > /tmp/babybudget-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl --silent --fail http://127.0.0.1:3123/ > /dev/null; then break; fi
            sleep 1
          done
          for route in / /login /signup /reset-password /budget /comparaison /informations /blog /cgu /confidentialite /blog/aides-caf-bebe-2026 /blog/cout-bebe-premiere-annee; do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' "http://127.0.0.1:3123$route")
            if [ "$status" != "200" ]; then
              echo "Route $route failed (HTTP $status)"
              tail -n 60 /tmp/babybudget-next.log
              exit 1
            fi
            echo "OK $route (HTTP $status)"
          done
          for route in /app /analyse /previsions /recurrences; do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' "http://127.0.0.1:3123$route")
            if [ "$status" != "307" ]; then
              echo "Protected route $route expected redirect, got HTTP $status"
              exit 1
            fi
            echo "OK $route (HTTP 307 → login)"
          done
      - name: Browser functional smoke test
        run: |
          set -euo pipefail
          npm run start -- -p 3123 > /tmp/babybudget-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl --silent --fail http://127.0.0.1:3123/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/functional-smoke.cjs
