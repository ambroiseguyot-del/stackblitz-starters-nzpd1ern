name: BabyBudget — Design review

on:
  push:
    branches:
      - design/refonte-premium-2026
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Lint, TypeScript & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: this-is-a-test-only-placeholder
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout the reviewed code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install compatible ESLint tooling for the review
        run: npm install --no-save --package-lock=false --ignore-scripts eslint@8.57.1 eslint-config-next@14.2.3
      - name: TypeScript
        run: npx tsc --noEmit
      - name: ESLint
        run: npm run lint
      - name: Production build (dummy Supabase environment)
        run: npm run build
