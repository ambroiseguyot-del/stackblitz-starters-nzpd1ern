name: BabyBudget — secure dependency lockfile regeneration

on:
  push:
    branches:
      - feat/babybudget-unified-upgrade-2026
    paths:
      - .github/workflows/upgrade-next.yml

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: this-is-a-test-only-placeholder
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Check out the exact review branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: feat/babybudget-unified-upgrade-2026
          persist-credentials: true
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Recreate npm lockfile for the updated manifest
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Check clean installation
        run: npm ci --no-audit --no-fund
      - name: Validate types
        run: npx tsc --noEmit
      - name: Validate lint
        run: npm run lint
      - name: Validate production build
        run: npm run build
      - name: Commit the verified lockfile only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore(deps): lock tested Next.js 15 and React 19 versions'
            git push origin HEAD:feat/babybudget-unified-upgrade-2026
          fi
